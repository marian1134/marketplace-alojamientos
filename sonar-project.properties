# Configuración de SonarCloud para StayHub
# Cambien estos dos valores por los que muestra SonarCloud al crear el proyecto
sonar.organization=marian1134
sonar.projectKey=marian1134_marketplace-alojamientos
sonar.projectName=StayHub - Marketplace de Alojamientos

sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java
sonar.sourceEncoding=UTF-8
sonar.java.binaries=backend/target/classes
sonar.java.source=21
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.exclusions=frontend/src/idiomas/en.json,**/*.css,frontend/src/ciudades.js,frontend/src/destinos.js
# El frontend todavía no tiene pruebas automatizadas: no cuenta para la cobertura
sonar.coverage.exclusions=frontend/src/**
# Espera el resultado del Quality Gate y lo muestra en el Pull Request
sonar.qualitygate.wait=true
