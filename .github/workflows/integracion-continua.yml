# Integración continua de StayHub.
# En cada Pull Request (y en cada cambio que llega a main):
#   1. compila el backend y ejecuta las pruebas automatizadas contra MySQL,
#   2. construye el frontend,
#   3. envía el análisis a SonarCloud (cuando el secreto SONAR_TOKEN existe).
name: Integración continua

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  backend:
    name: Backend · compilación y pruebas
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_USERNAME: root
      DB_PASSWORD: root
      MAIL_USERNAME: pruebas@stayhub.co
      MAIL_PASSWORD: sin-clave
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Crear la base de datos de pruebas (scripts 01 a 16, sin los 1.080 alojamientos)
        run: |
          for script in 01 02 03 04 06 07 08 09 10 11 13 14 16; do
            echo "Ejecutando $script"
            mysql -h 127.0.0.1 -uroot -proot --default-character-set=utf8mb4 < backend/database/${script}_*.sql
          done

      - name: Compilar y ejecutar las pruebas
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Guardar el resultado de las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas-backend
          path: |
            backend/target/surefire-reports
            backend/target/site/jacoco

      - name: Guardar lo compilado para SonarCloud
        uses: actions/upload-artifact@v4
        with:
          name: backend-compilado
          path: |
            backend/target/classes
            backend/target/site/jacoco/jacoco.xml

  frontend:
    name: Frontend · construcción
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Revisar el código (oxlint)
        working-directory: frontend
        run: npm run lint

      - name: Construir
        working-directory: frontend
        run: npm run build

  sonarcloud:
    name: SonarCloud · análisis estático
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Traer lo compilado del backend
        uses: actions/download-artifact@v4
        with:
          name: backend-compilado
          path: backend/target

      - name: Avisar si falta configurar SonarCloud
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::Falta el secreto SONAR_TOKEN. Configúrenlo en Settings > Secrets and variables > Actions para activar SonarCloud."

      - name: Análisis en SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_HOST_URL: https://sonarcloud.io
