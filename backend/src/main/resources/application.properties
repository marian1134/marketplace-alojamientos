spring.application.name=backend
# En internet (Render) el puerto lo da la variable PORT
server.port=${PORT:8081}
# Detrás de un proxy (Render/Vercel) respeta https y el dominio original
server.forward-headers-strategy=framework

# En internet se usa DB_URL (por ejemplo la base MySQL de Aiven con sslMode=REQUIRED)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/marketplace}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Envío de correos
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
# Nombre con el que llegan los correos
app.correo.nombre=${MAIL_NOMBRE:Alojamientos Marketplace}
# Dirección de la página: se usa en los enlaces de los correos
app.url-frontend=${URL_FRONTEND:http://localhost:5173}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Configuración de imágenes de alojamientos
app.ruta-imagenes=uploads/alojamientos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=50MB
# Muestra al frontend el mensaje de los errores de negocio
spring.web.error.include-message=always

# Pagos con Stripe. Sin claves se usa el pago simulado.
# Claves de prueba en https://dashboard.stripe.com/test/apikeys
stripe.clave-secreta=${STRIPE_SECRET_KEY:}
stripe.clave-publica=${STRIPE_PUBLISHABLE_KEY:}

# Pesos colombianos por cada dólar (para cobrar en USD)
app.tasa-usd=${TASA_USD:4000}
